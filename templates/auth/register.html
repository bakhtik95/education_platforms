{% extends "base.html" %}

{% block title %}Ro'yxatdan o'tish{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card auth-card-register">
        <div class="auth-header">
            <h1 class="auth-title">📚 Ro'yxatdan o'tish</h1>
            <p class="auth-subtitle">Yangi hisob yaratish</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="full_name">F.I.Sh.</label>
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-user"></i></span>
                    <input type="text" id="full_name" name="full_name" placeholder="To'liq ismingiz" 
                           value="{{ full_name or '' }}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="login">Login</label>
                <div class="input-group">
                    <span class="input-icon"><i class="fas fa-user-tag"></i></span>
                    <input type="text" id="login" name="login" placeholder="Loginingiz" 
                           value="{{ login or '' }}" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="email">Email</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-envelope"></i></span>
                        <input type="email" id="email" name="email" placeholder="email@example.com" 
                               value="{{ email or '' }}">
                    </div>
                </div>
                
                <div class="form-group half">
                    <label for="phone">Telefon</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-phone"></i></span>
                        <input type="tel" id="phone" name="phone" placeholder="+998901234567" 
                               value="{{ phone or '' }}">
                    </div>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="password">Parol</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password" name="password" placeholder="Parolingiz" required>
                    </div>
                </div>
                
                <div class="form-group half">
                    <label for="password_confirm">Parolni tasdiqlash</label>
                    <div class="input-group">
                        <span class="input-icon"><i class="fas fa-lock"></i></span>
                        <input type="password" id="password_confirm" name="password_confirm" 
                               placeholder="Parolni qayta kiriting" required>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn-primary btn-block">Ro'yxatdan o'tish</button>
        </form>
        
        <div class="auth-footer">
            <p>Hisobingiz bormi? <a href="{{ url_for('auth.login') }}">Kirish</a></p>
        </div>
    </div>
</div>
{% endblock %}
